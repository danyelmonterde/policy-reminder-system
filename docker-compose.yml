version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mypolicyreminder-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mypolicy_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-mypolicy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend-api:
    build: ./backend
    container_name: mypolicyreminder-springboot
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-mypolicy_db}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-mypolicy_user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  frontend-app:
    build: ./frontend
    container_name: mypolicyreminder-angular
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-api

volumes:
  db_data:
